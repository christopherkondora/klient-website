<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jelszó visszaállítás — Klient</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Red+Hat+Display:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Red Hat Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #01161E;
      color: #EFF6E0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: rgba(18, 69, 89, 0.12);
      border: 1px solid rgba(18, 69, 89, 0.2);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      color: #EFF6E0;
      letter-spacing: 0.05em;
      text-align: center;
      margin-bottom: 2rem;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.125rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #598392;
      font-size: 0.875rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      color: #598392;
      margin-bottom: 0.375rem;
    }
    input[type="password"] {
      width: 100%;
      padding: 0.625rem 0.875rem;
      background: rgba(1, 22, 30, 0.6);
      border: 1px solid rgba(18, 69, 89, 0.3);
      border-radius: 8px;
      color: #EFF6E0;
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus {
      border-color: rgba(18, 69, 89, 0.6);
    }
    input[type="password"]::placeholder {
      color: rgba(89, 131, 146, 0.4);
    }
    .field { margin-bottom: 1rem; }
    .strength-bar {
      display: flex;
      gap: 4px;
      margin-top: 0.5rem;
    }
    .strength-bar span {
      flex: 1;
      height: 4px;
      border-radius: 999px;
      background: rgba(89, 131, 146, 0.2);
      transition: background 0.3s;
    }
    .strength-label {
      font-size: 0.6875rem;
      margin-top: 0.25rem;
    }
    .btn {
      width: 100%;
      padding: 0.75rem;
      background: #124559;
      color: #EFF6E0;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      margin-top: 0.5rem;
    }
    .btn:hover { background: rgba(18, 69, 89, 0.8); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .error {
      color: #f87171;
      font-size: 0.75rem;
      text-align: center;
      margin-top: 0.75rem;
    }
    .success-container {
      text-align: center;
    }
    .success-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(18, 69, 89, 0.2);
      border: 1px solid rgba(18, 69, 89, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .success-icon svg { color: #AEC3B0; }
    .success-msg {
      color: #598392;
      font-size: 0.875rem;
      margin-top: 0.75rem;
      line-height: 1.5;
    }
    .hidden { display: none; }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(239, 246, 224, 0.3);
      border-top-color: #EFF6E0;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .match-ok { color: #34d399; font-size: 0.6875rem; margin-top: 0.25rem; }
    .match-err { color: #f87171; font-size: 0.6875rem; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">KLIENT</div>

    <!-- Form view -->
    <div id="form-view">
      <h1>Új jelszó beállítása</h1>
      <p class="subtitle">Add meg az új jelszavadat</p>

      <div class="field">
        <label for="password">Új jelszó</label>
        <input type="password" id="password" placeholder="••••••••" />
        <div class="strength-bar" id="strength-bar">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="strength-label" id="strength-label"></div>
      </div>

      <div class="field">
        <label for="confirm">Jelszó megerősítése</label>
        <input type="password" id="confirm" placeholder="••••••••" />
        <div id="match-msg"></div>
      </div>

      <button class="btn" id="submit-btn" disabled>Jelszó mentése</button>
      <div class="error hidden" id="error-msg"></div>
    </div>

    <!-- Success view -->
    <div id="success-view" class="success-container hidden">
      <div class="success-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h1>Jelszó sikeresen frissítve!</h1>
      <p class="success-msg">Nyisd meg a Klient alkalmazást, és jelentkezz be az új jelszavaddal.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    (function() {
      const SUPABASE_URL = 'https://arbhhltbjovuxwvfcnni.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFyYmhobHRiam92dXh3dmZjbm5pIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDkzOTg0MTUsImV4cCI6MjA2NDk3NDQxNX0.ra0MWB6_5H-MDi5OH1WFsaYnZ2DDkSAGadqyp6RjELs';

      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const passwordEl = document.getElementById('password');
      const confirmEl = document.getElementById('confirm');
      const submitBtn = document.getElementById('submit-btn');
      const errorMsg = document.getElementById('error-msg');
      const formView = document.getElementById('form-view');
      const successView = document.getElementById('success-view');
      const strengthBar = document.getElementById('strength-bar');
      const strengthLabel = document.getElementById('strength-label');
      const matchMsg = document.getElementById('match-msg');

      // Parse token from URL hash
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');
      const type = params.get('type');

      if (!accessToken || type !== 'recovery') {
        errorMsg.textContent = 'Érvénytelen vagy lejárt visszaállítási link.';
        errorMsg.classList.remove('hidden');
        submitBtn.style.display = 'none';
        document.querySelectorAll('.field').forEach(f => f.style.display = 'none');
        document.querySelector('.subtitle').textContent = '';
        return;
      }

      // Set session from token
      sb.auth.setSession({ access_token: accessToken, refresh_token: refreshToken || '' });

      function getStrength(pwd) {
        let score = 0;
        if (pwd.length >= 6) score++;
        if (pwd.length >= 10) score++;
        if (/[A-Z]/.test(pwd)) score++;
        if (/[a-z]/.test(pwd)) score++;
        if (/[0-9]/.test(pwd)) score++;
        if (/[^A-Za-z0-9]/.test(pwd)) score++;
        if (score <= 2) return { s: 1, label: 'Gyenge', color: '#ef4444' };
        if (score <= 3) return { s: 2, label: 'Közepes', color: '#fb923c' };
        if (score <= 4) return { s: 3, label: 'Jó', color: '#facc15' };
        return { s: 4, label: 'Erős', color: '#34d399' };
      }

      function updateUI() {
        const pwd = passwordEl.value;
        const conf = confirmEl.value;
        const str = getStrength(pwd);
        const bars = strengthBar.querySelectorAll('span');
        bars.forEach((b, i) => {
          b.style.background = i < str.s ? str.color : 'rgba(89,131,146,0.2)';
        });
        if (pwd.length > 0) {
          strengthLabel.textContent = 'Jelszó erőssége: ' + str.label;
          strengthLabel.style.color = str.color;
        } else {
          strengthLabel.textContent = '';
        }

        if (conf.length > 0 && conf !== pwd) {
          matchMsg.textContent = 'A jelszavak nem egyeznek';
          matchMsg.className = 'match-err';
        } else if (conf.length > 0 && conf === pwd) {
          matchMsg.textContent = 'A jelszavak egyeznek ✓';
          matchMsg.className = 'match-ok';
        } else {
          matchMsg.textContent = '';
        }

        submitBtn.disabled = pwd.length < 6 || pwd !== conf;
      }

      passwordEl.addEventListener('input', updateUI);
      confirmEl.addEventListener('input', updateUI);

      submitBtn.addEventListener('click', async function() {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span>Mentés...';
        errorMsg.classList.add('hidden');

        try {
          const { error } = await sb.auth.updateUser({ password: passwordEl.value });
          if (error) throw error;
          formView.classList.add('hidden');
          successView.classList.remove('hidden');
        } catch (err) {
          errorMsg.textContent = err.message || 'Hiba történt. Próbáld újra.';
          errorMsg.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Jelszó mentése';
        }
      });
    })();
  </script>
</body>
</html>

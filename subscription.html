<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Előfizetés kezelve — Klient</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Red+Hat+Display:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Red Hat Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #01161E;
      color: #EFF6E0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: rgba(18, 69, 89, 0.12);
      border: 1px solid rgba(18, 69, 89, 0.2);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      color: #EFF6E0;
      letter-spacing: 0.05em;
      margin-bottom: 2rem;
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(18, 69, 89, 0.2);
      border: 1px solid rgba(18, 69, 89, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon svg { color: #AEC3B0; }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.125rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    p {
      color: #598392;
      font-size: 0.875rem;
      line-height: 1.6;
    }
    .hint {
      color: rgba(89, 131, 146, 0.5);
      font-size: 0.75rem;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">KLIENT</div>
    <div class="icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Fizetési adatok frissítve!</h1>
    <p>Az előfizetésed adatait sikeresen módosítottad. Nyisd meg a Klient alkalmazást a folytatáshoz.</p>
    <p class="hint">Ezt az ablakot bezárhatod.</p>
  </div>
</body>
</html>
